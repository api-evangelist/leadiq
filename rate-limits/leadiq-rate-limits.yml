  status: 429
  meaning: Rate limit exceeded — back off and retry
  source: https://leadiqhelp.zendesk.com/hc/en-us/articles/29375289152795-LeadIQ-Public-API-Guide
  declared_on_operations: 14 of 14 operations in openapi/leadiq-prospector-api-openapi.yml declare a 429 response
