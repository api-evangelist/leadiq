response_headers:
  documented: []
  observed: []
  note: >-
    NO rate-limit response headers are published or observable. The Prospector
    OpenAPI declares a 429 on all fourteen operations but defines no response headers
    at all — there is no X-RateLimit-*, no RateLimit-*, and no Retry-After anywhere in
    the spec or the docs. An agent therefore cannot read remaining quota or a retry
    delay from a LeadIQ response; it can only observe the 429 after the fact. This is
    the single biggest runtime-semantics gap on the estate and it is a provider fix.
