  graphql:
    note: >-
      GraphQL errors are returned in the `errors` array in the response body EVEN WHEN
      the HTTP status is 200. The provider's guide is explicit: "Always check for this
      field." Any agent treating HTTP 200 as success on api.leadiq.com/graphql will
      silently swallow failures.
