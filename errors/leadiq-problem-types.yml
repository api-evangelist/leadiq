  title: Temporary upstream error
  meaning: 'A downstream LeadIQ service is unreachable — including EVS (the email verification service). The spec says explicitly "retry" / "safe to retry".'
  retryable: true
  source_operations:
  - 'POST /v1/lists/{listId}/prospects'
