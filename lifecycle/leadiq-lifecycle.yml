findings:
- The Prospector REST API is versioned (v1) and the GraphQL API is not; a breaking GraphQL change has no announcement channel.
- No deprecation policy, no Sunset headers, no changelog — three of the four operational-transparency signals are absent on an estate that is otherwise unusually well documented at the operation level.
