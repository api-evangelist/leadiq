finding: >-
  LeadIQ publishes NO first-party client library on any package registry. This is a
  real, checked absence, not an untried one — see probes[] below. The nearest thing
  LeadIQ ships is github.com/leadiq/api-samples, a private:true sample repository in
  Bash, Python and TypeScript that calls the API with plain curl / requests / fetch and
  is not distributable as a package (its own package.json is marked "private": true
  with a single dotenv dependency). Because there is no official SDK, no `SDKs` pointer
  is emitted for this provider.
