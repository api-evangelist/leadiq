divergence_note: >-
  The champion/company-tracking family (9 GraphQL fields) and the data-feedback
  mutation are the largest capability block with no agent surface at all: an agent
  connected over MCP cannot start, cancel, or read a company-tracking task, and cannot
  submit a data correction. Conversely the REST batch-create path (100 prospects per
  call) is the only high-throughput write on the estate and neither MCP nor GraphQL
  exposes it.
