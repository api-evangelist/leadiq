openapi: 3.2.0
info:
  title: Prospector Prospects API
  version: 1.0.0
  description: External REST API for LeadIQ prospector lists and prospects.
security:
- apiKeyAuth: []
- bearerAuth: []
tags:
- name: Prospects
paths:
  /v1/prospects:
    get:
      tags:
      - Prospects
      summary: List or search prospects
      description: Find prospects across all of the caller's leads, regardless of list membership. Pass **either** `email` alone, **or** `firstName` + `lastName` together, **or** no criteria to list every prospect the caller owns. Half-name searches and combined email+name are rejected with 400.
      parameters:
      - schema:
          type: string
          format: email
        required: false
        name: email
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: firstName
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: lastName
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
          example: 25
        required: false
        name: limit
        in: query
      - schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        required: false
        name: cursor
        in: query
      responses:
        '200':
          description: Matching prospects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProspects'
        '400':
          description: Invalid query (missing or mixed criteria)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV1Prospects
      x-operation-id-source: derived
    post:
      tags:
      - Prospects
      summary: Save a prospect without a list (create, or partial-update on match)
      description: 'Saves a prospect with no list membership. Use `POST /v1/lists/{listId}/prospects` instead to save-and-attach in a single call.


        Follows the same save semantics as that endpoint: a body matching a prospect the caller already owns (by `personId`, then `workEmail`, then exact `firstName`+`lastName`+`company`) **partially updates** it — absent fields keep their stored values — and returns `200`; otherwise a new prospect is created and returned with `201`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProspectInput'
      responses:
        '200':
          description: Existing prospect partially updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prospect'
        '201':
          description: Prospect created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prospect'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Temporary upstream error — retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Save timed out with the outcome unconfirmed — the prospect may exist; check before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV1Prospects
      x-operation-id-source: derived
  /v1/verify-email:
    get:
      tags:
      - Prospects
      summary: Verify a standalone email address
      description: Verify any email without creating or modifying a lead. Useful as a pre-flight check before creating a prospect. The verdict is computed by EVS (Email Verification Service) and folded into our four-value status enum.
      parameters:
      - schema:
          type: string
          format: email
          example: someone@example.com
        required: true
        name: email
        in: query
      responses:
        '200':
          description: Verification verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyStandaloneEmailResponse'
        '400':
          description: Missing or malformed `email`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: EVS unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getV1VerifyEmail
      x-operation-id-source: derived
  /v1/prospects/{prospectId}:
    get:
      tags:
      - Prospects
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        required: true
        name: prospectId
        in: path
      responses:
        '200':
          description: Prospect detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prospect'
        '400':
          description: Malformed `prospectId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found or not visible to caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get prospects by prospect id
      x-summary-source: derived
      operationId: getV1ProspectsByProspectId
      x-operation-id-source: derived
  /v1/prospects/{prospectId}/verify-email:
    post:
      tags:
      - Prospects
      summary: Verify the email on an existing prospect
      description: 'Verifies the email currently stored on the lead and persists the new status. The lead''s `workEmail` field is **never** modified — this is a verify-what''s-there operation, not a discover-and-replace one. Returns 409 with `code: "no_email_to_verify"` if the lead has no email (a state precondition, not a body-validation failure).'
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        required: true
        name: prospectId
        in: path
      responses:
        '200':
          description: Verification verdict + post-update prospect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '400':
          description: Malformed `prospectId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found or not visible to caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Lead has no email to verify (state precondition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: EVS unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV1ProspectsByProspectIdVerifyEmail
      x-operation-id-source: derived
  /v1/prospects/{prospectId}/export/salesforce:
    post:
      tags:
      - Prospects
      summary: Export a prospect into the caller's Salesforce
      description: 'Creates (or enriches) a Lead or Contact in the Salesforce org connected to the calling user, using the same export pipeline as the LeadIQ web app. Acts as the caller''s connected Salesforce user, so their Salesforce permissions, validation rules and duplicate rules all still apply.


        **Writes to an external system of record and cannot be undone by this API.** There is no delete path, and this endpoint is **not idempotent** — retrying may create a second record.


        Whether the prospect is saved as a Lead or a Contact is decided by the member''s `Save to` setting and the org''s governance; it is deliberately not selectable here.


        May consume Universal Credits when the prospect carries a DataIQ company id that the org has not already unlocked — the export unlocks company data to populate the Salesforce Account.


        `200` reports a terminal outcome, **including `duplicates_found`, where nothing was written.** `202` means the export was handed off but its outcome is unknown; do not retry on a `202`.'
      parameters:
      - schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        required: true
        name: prospectId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesforceExportRequest'
      responses:
        '200':
          description: Terminal outcome (created, updated, or duplicates found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesforceExportResult'
        '202':
          description: Submitted; terminal outcome unknown. Do not retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesforceExportAccepted'
        '400':
          description: Malformed `prospectId` or body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`salesforce_export_disabled` — a LeadIQ admin has disabled Salesforce export for this org; or `salesforce_export_not_enabled` — the feature is still rolling out and is not enabled for the caller''s team yet'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found or not visible to caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'State precondition: `salesforce_not_connected`, `salesforce_account_required`, `quality_skipped`, `export_rejected`, or `salesforce_rejected_record`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Temporary upstream error — safe to retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postV1ProspectsByProspectIdExportSalesforce
      x-operation-id-source: derived
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
      required:
      - code
      - message
    SalesforceDuplicate:
      type: object
      properties:
        id:
          type: string
          description: Salesforce record id.
        entityType:
          type: string
          description: Salesforce object of the candidate, e.g. `Lead`.
        name:
          type: string
        email:
          type: string
        company:
          type: string
      required:
      - id
      - entityType
    VerifyEmailResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - Verified
          - VerifiedLikely
          - Unverified
          - Invalid
        prospect:
          $ref: '#/components/schemas/Prospect'
      required:
      - status
      - prospect
    SalesforceExportRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: 'Create the record even though Salesforce reported possible duplicates. Only send `true` after a previous call returned `status: "duplicates_found"` and a human confirmed none of the candidates is the same person. Forcing blindly is the main way duplicate Leads get into a customer CRM.'
          example: false
        accountId:
          type: string
          pattern: ^001[a-zA-Z0-9]{12}([a-zA-Z0-9]{3})?$
          description: 'The Salesforce Account to file this prospect under as a Contact. Only meaningful for orgs whose "Save to" is "Create Contact if Account Exists, Otherwise Lead". Send it after a previous call returned `status: "account_choice_required"` and a human picked one of the `accounts`. Sending it skips the Account search entirely, so an id from anywhere else will be used as given. Resend it on every follow-up call for the same prospect (e.g. a `force: true` after `duplicates_found`); inputs are not remembered between calls.'
          example: 0015000000ABCDEAX3
        recordId:
          type: string
          pattern: ^(00Q|003)[a-zA-Z0-9]{12}([a-zA-Z0-9]{3})?$
          description: 'Enrich this existing Salesforce Lead or Contact instead of creating a new record. Send it after a previous call returned `status: "record_choice_required"` and a human picked one of the `records`. Sending it skips the duplicate search entirely, so a record id from anywhere else will be updated as given.'
          example: 00Q5000000ABCDEAX3
        updateExisting:
          type: boolean
          default: false
          description: Allow this export to update a Salesforce record that already matches this person, instead of only ever inserting. Mirrors the LeadIQ web app's "Update existing and create new" vs "Only export new" choice. Left false the export is insert-only, which is how this endpoint has always behaved. When true and exactly one record matches it is enriched; when several match you get `record_choice_required`.
          example: false
      additionalProperties: false
    Location:
      type: object
      properties:
        streetLine1:
          type: string
        streetLine2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
        formatted:
          type: string
    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        industry:
          type: string
        employees:
          type: integer
        location:
          $ref: '#/components/schemas/CompanyLocation'
        phone:
          type: string
    SalesforceExportResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - created
          - updated
          - duplicates_found
          - account_choice_required
          - record_choice_required
          description: '`created` — a new Salesforce record exists. `updated` — an existing record was enriched instead; only possible when the request carried `updateExisting: true` or `recordId`. `duplicates_found` — **nothing was written**; see `duplicates`. `account_choice_required` — **nothing was written**; several Accounts matched, see `accounts`, then call again with `accountId`. `record_choice_required` — **nothing was written**; several existing records could be this person, see `records`, then call again with `recordId`.'
        entityId:
          type: string
          description: Salesforce id of the created/updated record. Absent on `duplicates_found`, and possible to be absent on `updated`.
        entityType:
          type: string
        savedAs:
          type: string
          description: Which Salesforce object the export targeted, decided by the member's `Save to` setting and the org's governance — not by this API.
        requestId:
          type: string
          description: Correlation id for the export, for support lookups.
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/SalesforceDuplicate'
          description: Present on `duplicates_found`.
        records:
          type: array
          items:
            $ref: '#/components/schemas/SalesforceRecord'
          description: 'Present on `record_choice_required`: the existing Salesforce records that could be this person. Pick one and resend its `id` as `recordId`.'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/SalesforceAccount'
          description: 'Present on `account_choice_required`: the Accounts this prospect could be filed under. Pick one and resend its `id` as `accountId`.'
      required:
      - status
    SalesforceExportAccepted:
      type: object
      properties:
        status:
          type: string
          enum:
          - submitted
        requestId:
          type: string
        savedAs:
          type: string
        message:
          type: string
      required:
      - status
      - message
    VerifyStandaloneEmailResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - Verified
          - VerifiedLikely
          - Unverified
          - Invalid
      required:
      - status
    Prospect:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        personId:
          type: string
        linkedinId:
          type: string
        linkedinUrl:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        name:
          type: string
        picture:
          type: string
        title:
          type: string
        seniority:
          type: string
        function:
          type: string
        workEmail:
          type: string
        emailStatus:
          type: string
        personalEmails:
          type: array
          items:
            type: string
        mobilePhones:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              status:
                type: string
                enum:
                - Verified
            required:
            - value
        location:
          $ref: '#/components/schemas/Location'
        company:
          $ref: '#/components/schemas/Company'
        listIds:
          type: array
          items:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
          example: '2025-01-15T12:34:56.789Z'
        updatedAt:
          type: string
          format: date-time
          example: '2025-01-15T12:34:56.789Z'
      required:
      - id
      - listIds
      - createdAt
      - updatedAt
    SalesforceAccount:
      type: object
      properties:
        id:
          type: string
          description: Salesforce Account id — send this back as `accountId`.
        name:
          type: string
        link:
          type: string
          description: Opens the Account record in the connected Salesforce org.
        ownerName:
          type: string
        parentName:
          type: string
          description: Parent Account name, when this one sits under another — often what tells two near-identical Accounts apart.
      required:
      - id
    ProspectInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        workEmail:
          type: string
          format: email
        phone:
          type: string
          minLength: 1
          description: Single mobile phone. Use phones, which takes precedence
          deprecated: true
        phones:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 10
          description: Mobile phone numbers, best first
        title:
          type: string
          minLength: 1
        seniority:
          type: string
          enum:
          - VP
          - Manager
          - Director
          - Executive
          - SeniorIndividualContributor
          - Other
        function:
          type: string
          minLength: 1
        company:
          type: string
          minLength: 1
        companyDomain:
          type: string
          minLength: 1
        companyIndustry:
          type: string
          minLength: 1
        companyId:
          type: string
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9]*-[0-9a-f]{24}$
          description: 'DataIQ company id (a search result''s `companyId`). Send it whenever the person came from a search: it links the prospect to the company record, so the company is captured once instead of twice.'
        linkedinUrl:
          type: string
          format: uri
        emailStatus:
          type: string
          enum:
          - Unverified
          - Verified
          - VerifiedLikely
        location:
          $ref: '#/components/schemas/Location'
        notes:
          type: string
          maxLength: 5000
        personId:
          type: string
          minLength: 1
          description: DataIQ ID. Provide it for better matching and deduplication
      required:
      - firstName
      - lastName
      additionalProperties: false
    CompanyLocation:
      type: object
      properties:
        streetLine1:
          type: string
        streetLine2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
        formatted:
          type: string
    SalesforceRecord:
      type: object
      properties:
        id:
          type: string
          description: Salesforce record id — send this back as `recordId`.
        entityType:
          type: string
          description: '`Lead` or `Contact`.'
        name:
          type: string
        email:
          type: string
        title:
          type: string
        company:
          type: string
        link:
          type: string
        ownerName:
          type: string
        updatable:
          type: boolean
          description: False when one-click update is switched off for this record type. It is listed so you can see the record exists, but choosing it will not work.
      required:
      - id
      - entityType
      - updatable
    PaginatedProspects:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Prospect'
        nextCursor:
          type: string
          nullable: true
          pattern: ^[0-9a-fA-F]{24}$
      required:
      - items
      - nextCursor
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Send your LeadIQ API key as the `X-API-Key` header value — no prefix, no encoding.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2 access token (JWT) issued for an audience accepted by this service.
x-provenance:
  method: harvested
  publisher: LeadIQ
  source: https://prospector.leadiq.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
