findings:
- >-
  Two id conventions coexist. The saved-workspace objects (List, Prospect) use bare
  24-char Mongo-style hex; the canonical data graph uses prefixed ids
  (PersonID-<uuid>, MergedCompany-<hex>). An agent moving between search results and
  saved prospects must not assume one id space.
- Location and CompanyLocation are byte-identical schemas declared twice.
