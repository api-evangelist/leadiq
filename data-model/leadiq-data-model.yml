note: >-
  Entity graph derived from the Prospector OpenAPI components.schemas ($ref links and
  id-reference fields) and cross-checked against the live GraphQL SDL. The two surfaces
  model the SAME core — Person/Prospect, Company, List — but with different field names
  and different id spaces, which is recorded in id_spaces below.
entities:
- name: List
  surface: rest+graphql
  schema: openapi/leadiq-prospector-api-openapi.yml#/components/schemas/List
  id: id
  id_format: 24-char hex (^[0-9a-fA-F]{24}$)
  fields: [id, name, role, description, status, visibility, startDate, endDate, createdAt, updatedAt]
  enums:
    role: ListRole (caller's relationship to the list — owner or collaborator)
  graphql_twin: List / ListConnection
  note: Name is unique per account — POST /v1/lists returns 409 on a duplicate name.
- name: Prospect
  surface: rest+graphql
  schema: openapi/leadiq-prospector-api-openapi.yml#/components/schemas/Prospect
  id: id
  id_format: 24-char hex
  fields: [id, personId, linkedinId, linkedinUrl, firstName, lastName, name, picture, title, seniority, function, workEmail, emailStatus, personalEmails, mobilePhones, location, company, listIds, notes, createdAt, updatedAt]
  graphql_twin: Prospect / ProspectConnection
  note: >-
    A Prospect is a SAVED copy inside the customer's workspace. It is not the same
    object as a Person from the search graph — `personId` is the foreign key back into
    LeadIQ's canonical people data.
- name: Company
  surface: rest+graphql
  schema: openapi/leadiq-prospector-api-openapi.yml#/components/schemas/Company
  id: id
  fields: [id, name, domain, industry, employees, location, phone]
  graphql_twin: Company / CompanyDetails / CompanyInfo / ProspectorCompany
  note: The REST Company is a thin projection; the GraphQL side carries firmographics, NAICS/SIC, technologies, funding and hierarchy.
- name: Location
  surface: rest
  schema: openapi/leadiq-prospector-api-openapi.yml#/components/schemas/Location
  fields: [streetLine1, streetLine2, city, state, zip, country, formatted]
  value_object: true
- name: CompanyLocation
  surface: rest
  schema: openapi/leadiq-prospector-api-openapi.yml#/components/schemas/CompanyLocation
  fields: [streetLine1, streetLine2, city, state, zip, country, formatted]
  value_object: true
  note: Structurally identical to Location but declared separately — a duplication in the spec, not a semantic difference.
- name: WhoAmI
  surface: rest
  schema: openapi/leadiq-prospector-api-openapi.yml#/components/schemas/WhoAmI
  fields: [user, team]
  note: Caller identity envelope returned by GET /v1/whoami.
- name: SalesforceExportResult
  surface: rest
  schema: openapi/leadiq-prospector-api-openapi.yml#/components/schemas/SalesforceExportResult
  fields: [status, entityId, entityType, savedAs, requestId, duplicates]
  external_system: Salesforce
  note: entityId/entityType/savedAs address a record in the CALLER's Salesforce org, not in LeadIQ.
- name: SalesforceDuplicate
  surface: rest
  schema: openapi/leadiq-prospector-api-openapi.yml#/components/schemas/SalesforceDuplicate
  fields: [id, entityType, name, email, company]
- name: Person
  surface: graphql
  schema: graphql/leadiq.graphql#Person
  note: >-
    The canonical people record behind search and enrichment. Related GraphQL types:
    PersonRecord, PersonCurrentPosition, PersonPreviousPosition, PersonJobChange,
    NameInfo, LinkedinRecord, WorkEmailRecordType, PersonalEmailRecordType,
    MobilePhoneRecord, WorkPhoneRecordType, EducationRecord, LocationRecord.
- name: Account
  surface: graphql
  schema: graphql/leadiq.graphql#Account
  note: 'Plan and credit state: Plan, DataHubPlan, UniversalPlan, UniversalCost, DataPointCost, SKU, UnlockableDataPoint, ConfigurableDataPoint.'
