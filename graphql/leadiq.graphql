  searchPeople(input: SearchPeopleInput!): SearchResult!
  """
  Lightweight preview to check whether a work email and/or phone can likely be produced for a person.
Does not charge credits. Returns the matched personId and the requested boolean flags.
At least one of `hasEmail` or `hasPhone` must be selected.
  """
  searchPeoplePreview(input: SearchPeoplePreviewInput!): SearchPeoplePreviewResult!
  "Search for companies based on identifying information: name, domain, country, etc"
  searchCompany(input: SearchCompanyInput!): CompanySearchResult!
  "Advanced search for grouped response"
  groupedAdvancedSearch(input: GroupedSearchInput!): CompanySearchResponse!
  "Advanced search for flat response"
  flatAdvancedSearch(input: FlatSearchInput!): PersonSearchResponse!
  "Match profile by email"
  matchProfile(input: MatchingServiceInput!): MatchingServiceResponse!
  "View API credit usage and limit"
  usage: UsageMetaType!
  "Last regenerated time"
  regeneratedTime(input: RegeneratedTimeInput!): RegeneratedTimeResult!
  workatoToken(orgDomainUrl: String!): WorkatoTokenResponse!
  trackedContacts(importId: String, limit: Int!, cursor: Cursor, uniqueOnly: Boolean): TrackedContactsConnection!
  contactTrackingBalance: BalanceResponse
  "Get the current status of the company tracking task."
  companyTrackingTask(id: ID!, uniqueOnly: Boolean): CompanyTrackingTask
  "Get the list of tracked companies."
  trackedCompanies(first: Int, after: ID): TrackedCompaniesConnection
  "The current ICP definitions"
  icpDefinitions(productLines: [ICPProductLine!]): ICPDefinitionResponse
  lists(limit: Int = 25, cursor: ID): ListConnection
  list(id: ID!): List
  prospect(id: ID!): Prospect
}

