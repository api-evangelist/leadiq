"BigDecimal type"
scalar BigDecimal

"A pagination cursor"
scalar Cursor

"An instantaneous point on the time-line represented by a standard date time string"
scalar Instant

"Represents a JSON object"
scalar Json

"A date without a time-zone in the ISO-8601 calendar system using the format 1970-01-01"
scalar LocalDate

"The `Long` scalar type represents non-fractional signed whole numeric values. Long can represent values between -(2^63) and 2^63 - 1."
scalar Long

"Zoned date time type"
scalar ZonedDateTime

union Email = EmailSuppressed | EmailValue

union PersonalPhones = PersonalPhonesSuppressed | PersonalPhonesValue

union WorkPhones = WorkPhonesSuppressed | WorkPhonesValue

union WorkatoTokenResponse = WorkatoTokenResponseFailure | WorkatoTokenResponseSuccess

