apis:
- aid: leadiq:leadiq-mcp-server
  name: LeadIQ MCP Server
  description: >-
    Remote Model Context Protocol server at https://mcp.leadiq.com/mcp exposing LeadIQ's verified B2B
    contact and company intelligence to AI agents over Streamable HTTP. Seventeen tools — EnrichPeople,
    EnrichCompanies, FindPeople, FindCompanies, FindJobChanges, seven prospect/list management tools,
    VerifyEmail, VerifyProspectEmail, ExportProspectToSalesforce and CheckCredits — plus a guided `icp`
    prompt. Authentication is OAuth 2.0 with dynamic client registration against LeadIQ's Auth0 tenant
    (scopes leadiq:api and offline_access); no client id or secret is configured and no API key is accepted.
    Certified as a Microsoft connector across Copilot Studio, Power Automate, Power Apps and Logic Apps,
    and documented for Claude and ChatGPT. Metering is credit-based and the assistant discloses estimated
    cost before paid calls.
  tags:
  - MCP
